<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!--
=================================================================
 SQL PARA SUPABASE — ejecutar en el SQL Editor de tu proyecto
=================================================================

-- 1. Tabla usuarios
create table if not exists public.usuarios (
  id          bigserial primary key,
  user_id     uuid references auth.users(id) on delete cascade unique not null,
  nombre      text not null,
  documento   text,
  email       text,
  direccion   text,
  telefono    text,
  whatsapp    text,
  tipo        text default 'natural',
  es_admin    boolean default false,
  created_at  timestamptz default now()
);

-- 2. Tabla pedidos
create table if not exists public.pedidos (
  id              bigserial primary key,
  invoice_number  text unique not null,
  user_id         uuid references auth.users(id) on delete cascade not null,
  items           jsonb not null,
  total           numeric not null,
  payment_method  text,
  status          text default 'Pendiente',
  nota            text,
  fecha           timestamptz default now()
);

-- 3. Tabla ventas_directas
create table if not exists public.ventas_directas (
  id               bigserial primary key,
  user_id          uuid references auth.users(id) on delete cascade not null,
  cant             integer not null,
  tipo_nombre      text,
  precio_unitario  numeric,
  total            numeric,
  nota             text,
  fecha            timestamptz default now()
);

-- 4. Tabla sugerencias (sin auth requerida)
create table if not exists public.sugerencias (
  id       bigserial primary key,
  nombre   text,
  email    text,
  mensaje  text,
  fecha    timestamptz default now()
);

-- RLS
alter table public.usuarios       enable row level security;
alter table public.pedidos        enable row level security;
alter table public.ventas_directas enable row level security;
alter table public.sugerencias    enable row level security;

-- Políticas usuarios
create policy "usuario_propio" on public.usuarios for all using (auth.uid() = user_id);
create policy "admin_todos_usuarios" on public.usuarios for all using (
  exists(select 1 from public.usuarios u where u.user_id = auth.uid() and u.es_admin = true)
);

-- Políticas pedidos
create policy "pedido_propio" on public.pedidos for all using (auth.uid() = user_id);
create policy "admin_todos_pedidos" on public.pedidos for all using (
  exists(select 1 from public.usuarios u where u.user_id = auth.uid() and u.es_admin = true)
);

-- Políticas ventas directas
create policy "admin_ventas_directas" on public.ventas_directas for all using (
  exists(select 1 from public.usuarios u where u.user_id = auth.uid() and u.es_admin = true)
);

-- Políticas sugerencias
create policy "cualquiera_inserta" on public.sugerencias for insert with check (true);
create policy "admin_lee_sugerencias" on public.sugerencias for select using (
  exists(select 1 from public.usuarios u where u.user_id = auth.uid() and u.es_admin = true)
);

=================================================================
-->

<style>
/* ====================== ROOT ====================== */
:root {
  --c-bg:       #f7f2e8;
  --c-paper:    #fdfaf3;
  --c-cream:    #fff8ec;
  --c-amber:    #b8712a;
  --c-amber2:   #d4903f;
  --c-amber3:   #e8b870;
  --c-pale:     #f2ddb5;
  --c-brown:    #4a2c0e;
  --c-brown2:   #7a4a20;
  --c-brown3:   #a06c3a;
  --c-green:    #3b6b3b;
  --c-red:      #9b2a1a;
  --c-muted:    #8a6840;
  --c-border:   #d9c49a;
  --c-shadow:   rgba(74,44,14,0.12);
  --r:          1.1rem;
  --r-sm:       0.65rem;
  --font-head:  'Playfair Display', Georgia, serif;
  --font-body:  'Crimson Pro', Georgia, serif;
  --font-mono:  'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  font-size: 1.05rem;
  color: var(--c-brown);
  background: var(--c-bg);
  background-image:
    url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='none'/%3E%3Ccircle cx='30' cy='30' r='0.6' fill='%23b8712a' opacity='0.07'/%3E%3C/svg%3E");
  min-height: 100vh;
}
h1,h2,h3,h4,h5 { font-family: var(--font-head); }

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--c-bg); }
::-webkit-scrollbar-thumb { background: var(--c-pale); border-radius: 3px; }

/* ====================== PAGES ====================== */
.page { min-height: 100vh; display: flex; flex-direction: column; }
#authPage { background: linear-gradient(160deg, #1c0f05 0%, #3a1e06 45%, #6b3c14 100%); position: relative; overflow: hidden; }
#authPage::before {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='40' cy='40' r='1' fill='%23e8b870' opacity='0.15'/%3E%3C/svg%3E");
  pointer-events: none;
}
#clientPage, #adminPage { display: none; flex-direction: column; }
#clientPage.active, #adminPage.active { display: flex; }

/* ====================== AUTH ====================== */
.auth-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; gap: 2rem; }
.auth-brand { text-align: center; color: var(--c-pale); }
.auth-brand .brand-egg { font-size: 3.5rem; margin-bottom: 0.5rem; display: block; animation: float 3s ease-in-out infinite; }
.auth-brand h1 { font-size: 1.8rem; font-style: italic; color: var(--c-amber3); }
.auth-brand p { font-size: 1rem; opacity: 0.75; margin-top: 0.2rem; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

.auth-card {
  background: var(--c-paper);
  border-radius: 1.5rem;
  padding: 2.5rem 2rem;
  width: 100%; max-width: 500px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  border: 1px solid rgba(232,184,112,0.2);
}
.auth-tabs { display: flex; gap: 0.25rem; background: var(--c-bg); border-radius: 3rem; padding: 0.2rem; margin-bottom: 2rem; }
.auth-tab { flex: 1; border: none; background: none; padding: 0.6rem 1rem; border-radius: 2.5rem; font-family: var(--font-body); font-size: 1rem; font-weight: 600; cursor: pointer; color: var(--c-muted); transition: all .2s; }
.auth-tab.active { background: var(--c-amber); color: white; box-shadow: 0 2px 12px rgba(184,113,42,0.35); }

/* ====================== FORMS ====================== */
.form-row { display: grid; gap: 0.85rem; margin-bottom: 0.85rem; }
.form-row.c2 { grid-template-columns: 1fr 1fr; }
.fg { display: flex; flex-direction: column; gap: 0.3rem; }
.fg label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--c-brown3); }
.fg input, .fg select, .fg textarea {
  padding: 0.65rem 0.9rem;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-sm);
  font-family: var(--font-body);
  font-size: 1rem;
  background: white;
  color: var(--c-brown);
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
.fg input:focus, .fg select:focus, .fg textarea:focus {
  border-color: var(--c-amber2);
  box-shadow: 0 0 0 3px rgba(184,113,42,0.12);
}
.fg textarea { resize: vertical; min-height: 80px; }

/* ====================== BUTTONS ====================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  padding: 0.65rem 1.4rem;
  border: none; border-radius: 3rem;
  font-family: var(--font-body); font-size: 1rem; font-weight: 600;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--c-amber); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--c-brown2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(184,113,42,0.4); }
.btn-success { background: var(--c-green); color: white; }
.btn-success:hover:not(:disabled) { background: #2d5430; transform: translateY(-1px); }
.btn-danger { background: var(--c-red); color: white; }
.btn-danger:hover:not(:disabled) { background: #7a1f10; }
.btn-ghost { background: var(--c-pale); color: var(--c-brown2); }
.btn-ghost:hover:not(:disabled) { background: var(--c-border); }
.btn-outline { background: transparent; border: 1.5px solid var(--c-amber); color: var(--c-amber); }
.btn-outline:hover:not(:disabled) { background: var(--c-amber); color: white; }
.btn-block { width: 100%; }
.btn-sm { padding: 0.35rem 0.85rem; font-size: 0.85rem; }

/* ====================== ALERTS ====================== */
.alert { padding: 0.6rem 1rem; border-radius: var(--r-sm); font-size: 0.92rem; margin-top: 0.5rem; }
.alert-error   { background: #fdf0ee; color: var(--c-red);   border: 1px solid #f5c6c1; }
.alert-success { background: #edf7ed; color: var(--c-green); border: 1px solid #b7dbb7; }
.alert-info    { background: #fef8ee; color: var(--c-amber);  border: 1px solid var(--c-pale); }
.alert-warn    { background: #fff8e1; color: #7a5600; border: 1px solid #ffd54f; }

/* ====================== TOPBAR ====================== */
.topbar {
  background: var(--c-paper);
  border-bottom: 1.5px solid var(--c-border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 20px var(--c-shadow);
}
.topbar-inner { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
.topbar-brand { display: flex; align-items: center; gap: 0.75rem; }
.topbar-logo {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--c-pale); border: 2px solid var(--c-amber);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; overflow: hidden; cursor: pointer;
}
.topbar-title { font-family: var(--font-head); font-size: 1.1rem; font-style: italic; color: var(--c-brown); }
.topbar-sub { font-size: 0.75rem; color: var(--c-muted); }
.topbar-actions { display: flex; align-items: center; gap: 0.65rem; font-size: 0.9rem; color: var(--c-brown2); }

/* ====================== TABS NAV ====================== */
.tab-nav {
  background: var(--c-paper);
  border-bottom: 1.5px solid var(--c-border);
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-nav-inner { display: flex; padding: 0 1.25rem; min-width: max-content; }
.tab-btn {
  background: none; border: none;
  border-bottom: 2.5px solid transparent;
  padding: 0.8rem 1.1rem;
  font-family: var(--font-body); font-size: 1rem; font-weight: 600;
  color: var(--c-muted); cursor: pointer; transition: all .2s;
  white-space: nowrap;
}
.tab-btn.active { color: var(--c-amber); border-bottom-color: var(--c-amber); }
.tab-btn:hover:not(.active) { color: var(--c-brown2); }

.main { flex: 1; padding: 1.5rem; max-width: 1200px; margin: 0 auto; width: 100%; }
.panel { display: none; }
.panel.active { display: block; }

/* ====================== CARDS ====================== */
.card {
  background: var(--c-paper);
  border-radius: var(--r);
  border: 1.5px solid var(--c-border);
  padding: 1.5rem;
  box-shadow: 0 2px 20px var(--c-shadow);
  margin-bottom: 1.25rem;
}
.card-title {
  font-family: var(--font-head); font-size: 1.15rem; font-weight: 700;
  color: var(--c-brown); margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.5rem;
  border-bottom: 1px dashed var(--c-border); padding-bottom: 0.6rem;
}
.card-title small { font-family: var(--font-body); font-weight: 400; font-size: 0.85rem; color: var(--c-muted); margin-left: auto; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

/* ====================== PRICE DISPLAY ====================== */
.price-display {
  background: linear-gradient(135deg, #fdf5e0, #f5e4b8);
  border: 1.5px solid var(--c-amber3);
  border-radius: var(--r-sm);
  padding: 1rem;
  text-align: center;
  margin: 0.75rem 0;
}
.price-big { font-family: var(--font-head); font-size: 2rem; font-weight: 700; color: var(--c-brown); }
.price-label { font-size: 0.8rem; color: var(--c-muted); margin-top: 0.15rem; }
.price-rule { font-size: 0.82rem; color: var(--c-amber); margin-top: 0.3rem; font-style: italic; }

.total-bar {
  background: var(--c-pale);
  border-radius: var(--r-sm);
  padding: 0.7rem 1rem;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 600; margin: 0.5rem 0;
  font-size: 1.05rem;
}
.total-bar .total-num { font-family: var(--font-head); font-size: 1.2rem; color: var(--c-brown); }

/* ====================== PROMO BANNER ====================== */
.promo-banner {
  background: linear-gradient(95deg, #fff4d6, #ffeab5);
  border-left: 5px solid var(--c-amber2);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  padding: 0.75rem 1.1rem;
  margin-bottom: 1.25rem;
  display: flex; align-items: center; gap: 0.6rem;
  font-weight: 600; color: var(--c-brown2);
  font-size: 0.95rem;
}

/* ====================== CART ====================== */
.cart-empty { text-align: center; padding: 2.5rem 1rem; color: var(--c-muted); font-style: italic; font-size: 1.1rem; }
.cart-empty .egg-empty { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; opacity: 0.4; }
.cart-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px dashed var(--c-border); }
.cart-row:last-of-type { border-bottom: none; }
.cart-total { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: var(--c-pale); border-radius: var(--r-sm); font-weight: 700; margin-top: 0.5rem; }

/* ====================== ORDER CARDS ====================== */
.order-card {
  background: var(--c-cream);
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-sm);
  padding: 0.9rem 1rem;
  margin-bottom: 0.75rem;
  position: relative;
}
.order-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--c-amber3);
  border-radius: 4px 0 0 4px;
}
.order-card.delivered::before { background: var(--c-green); }
.order-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; flex-wrap: wrap; }
.order-num { font-family: var(--font-mono); font-size: 0.88rem; font-weight: 600; color: var(--c-brown2); }
.order-date { font-size: 0.8rem; color: var(--c-muted); }
.order-total { font-family: var(--font-head); font-weight: 700; color: var(--c-brown); }

/* ====================== BADGE ====================== */
.badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.18rem 0.6rem; border-radius: 2rem; font-size: 0.72rem; font-weight: 700; }
.badge-pending   { background: #fef3e0; color: var(--c-amber); border: 1px solid var(--c-pale); }
.badge-delivered { background: #edf7ed; color: var(--c-green); border: 1px solid #b7dbb7; }
.badge-admin     { background: #e8e0ff; color: #4a2b7a; border: 1px solid #c5b8ee; }

/* ====================== META HERO ====================== */
.meta-hero {
  background: linear-gradient(145deg, #1c0f05, #3a1e06, #5a2e0a);
  border-radius: var(--r);
  padding: 2rem;
  color: white;
  margin-bottom: 1.25rem;
  position: relative; overflow: hidden;
}
.meta-hero::after {
  content: '';
  position: absolute; right: -20px; top: -20px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(232,184,112,0.15), transparent);
  border-radius: 50%;
}
.meta-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--c-amber3); opacity: 0.85; }
.meta-goal { font-family: var(--font-head); font-size: 2.2rem; font-weight: 700; color: var(--c-amber3); margin: 0.3rem 0; }
.meta-progress { background: rgba(255,255,255,0.12); border-radius: 2rem; height: 12px; overflow: hidden; margin: 1rem 0; }
.meta-fill { height: 100%; background: linear-gradient(90deg, var(--c-amber), var(--c-amber3), #f5c542); border-radius: 2rem; transition: width 1s ease; }
.meta-row { display: flex; justify-content: space-between; align-items: center; }
.meta-pct { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; }
.meta-figure { font-size: 2rem; animation: spin-slow 6s linear infinite; }
@keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* ====================== STAT CARDS ====================== */
.stat-card { background: var(--c-cream); border: 1.5px solid var(--c-border); border-radius: var(--r-sm); padding: 1rem; text-align: center; }
.stat-val { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; color: var(--c-amber); }
.stat-label { font-size: 0.8rem; color: var(--c-muted); margin-top: 0.2rem; }

/* ====================== DATA TABLE ====================== */
.data-table-wrap { overflow-x: auto; margin: -0.25rem; }
.data-table { width: 100%; border-collapse: collapse; min-width: 560px; }
.data-table th { background: var(--c-pale); padding: 0.55rem 0.75rem; text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--c-brown2); white-space: nowrap; }
.data-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--c-border); font-size: 0.92rem; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--c-cream); }
.data-table input, .data-table select { padding: 0.35rem 0.5rem; border: 1.5px solid var(--c-border); border-radius: var(--r-sm); font-family: var(--font-body); font-size: 0.9rem; background: white; width: 100%; }

/* ====================== MODAL ====================== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(26,13,3,0.75);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 1rem;
}
.modal-box {
  background: var(--c-paper);
  border-radius: var(--r);
  padding: 2rem;
  max-width: 580px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 40px 100px rgba(0,0,0,0.5);
  border: 1.5px solid var(--c-border);
}
.modal-title { font-family: var(--font-head); font-size: 1.3rem; font-style: italic; color: var(--c-brown); margin-bottom: 1.25rem; border-bottom: 1px dashed var(--c-border); padding-bottom: 0.75rem; }
.modal-actions { display: flex; gap: 0.6rem; margin-top: 1.25rem; }
.hidden { display: none !important; }

/* ====================== INVOICE ====================== */
.invoice { font-family: var(--font-body); }
.invoice-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 2px solid var(--c-pale); }
.invoice-brand { font-family: var(--font-head); font-size: 1.3rem; font-style: italic; }
.invoice-num { font-family: var(--font-mono); font-size: 0.9rem; text-align: right; color: var(--c-muted); }
.invoice-section { margin-bottom: 1rem; }
.invoice-section h4 { font-family: var(--font-head); font-size: 0.95rem; color: var(--c-brown2); margin-bottom: 0.4rem; }
.invoice-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
.invoice-table th { background: var(--c-pale); padding: 0.45rem 0.6rem; text-align: left; font-size: 0.8rem; text-transform: uppercase; }
.invoice-table td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--c-border); font-size: 0.9rem; }
.invoice-total { text-align: right; font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; margin-top: 0.75rem; color: var(--c-brown); }
.invoice-footer { margin-top: 1rem; font-size: 0.8rem; color: var(--c-muted); text-align: center; border-top: 1px dashed var(--c-border); padding-top: 0.75rem; font-style: italic; }
@media print { body>*:not(#invoiceModal){display:none!important} .modal-overlay{position:static;background:none;} .modal-box{box-shadow:none;border:none;} .modal-actions{display:none;} }

/* ====================== FOOTER ====================== */
.app-footer {
  background: var(--c-paper);
  border-top: 1.5px solid var(--c-border);
  padding: 0.7rem 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 0.5rem;
}

function filterByPeriod(list, period, dateKey = 'fecha') {
  const now = new Date();
  let cutoff = new Date(0);
  if (period === '7d')  { cutoff = new Date(); cutoff.setDate(now.getDate() - 7); }
  if (period === 'mes') { cutoff = new Date(now.getFullYear(), now.getMonth(), 1); }
  if (period === 'anio'){ cutoff = new Date(now.getFullYear(), 0, 1); }
  return period === 'todo' ? list : list.filter(x => new Date(x[dateKey]) >= cutoff);
}

function initClientOrderPanel() {
  $('promoText').textContent = calcPromoText(G.tipo);
  updateClientPrice();

  $('clientCant').addEventListener('input', updateClientPrice);
  $('payMethod').addEventListener('change', () => {
    const v = $('payMethod').value;
    $('qrBox').classList.toggle('hidden', v === 'efectivo');
  });
  $('addCartBtn').onclick = addToCart;
  $('confirmOrderBtn').onclick = confirmOrder;
}

function updateClientPrice() {
  const cant   = parseInt($('clientCant').value) || 0;
  const precio = calcPrecio(G.tipo, cant);
  $('clientPrecio').textContent    = pesos(precio);
  $('clientPriceRule').textContent = calcRuleText(G.tipo, cant);
  $('clientTotal').textContent     = pesos(cant * precio);
}

function addToCart() {
  const cant = parseInt($('clientCant').value);
  if (!cant || cant < 1 || cant > 500) { alert('Ingresa una cantidad válida (1-500)'); return; }
  const precio = calcPrecio(G.tipo, cant);
  G.carrito.push({ cant, precio, sub: cant * precio });
  $('clientCant').value = 1;
  updateClientPrice();
  renderCart();
}

function renderCart() {
  const cont = $('cartContent');
  if (!G.carrito.length) {
    cont.innerHTML = `<div class="cart-empty"><span class="egg-empty">🥚</span>Tu carrito está vacío</div>`;
    $('cartCount').textContent = '0 items';
    return;
  }
  let total = 0, rows = '';
  G.carrito.forEach((item, i) => {
    total += item.sub;
    rows += `<div class="cart-row">
      <div><strong>${item.cant}</strong> cubetas × ${pesos(item.precio)}</div>
      <div style="display:flex;align-items:center;gap:0.5rem">
        <strong>${pesos(item.sub)}</strong>
        <button class="btn btn-ghost btn-sm" onclick="removeFromCart(${i})" title="Eliminar"><i class="fas fa-times"></i></button>
      </div>
    </div>`;
  });
  cont.innerHTML = rows + `<div class="cart-total"><span>Total</span><span style="font-family:var(--font-head);font-size:1.2rem">${pesos(total)}</span></div>`;
  $('cartCount').textContent = `${G.carrito.reduce((s,i)=>s+i.cant,0)} cubetas`;
}

window.removeFromCart = (i) => { G.carrito.splice(i, 1); renderCart(); };

async function confirmOrder() {
  if (!G.carrito.length) { alert('El carrito está vacío'); return; }
  const btn = $('confirmOrderBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando…';
  try {
    const total = G.carrito.reduce((s,i)=>s+i.sub, 0);
    const metodo = $('payMethod').value;
    const nota   = $('orderNota').value.trim();
    const prev   = await dbPedidosUser(G.userId);
    const num    = `FAC-${String(prev.length + 1).padStart(6,'0')}`;
    await dbCreatePedido({
      invoice_number: num, user_id: G.userId,
      items: G.carrito, total, payment_method: metodo,
      status: 'Pendiente', nota, fecha: new Date().toISOString()
    });
    G.carrito = [];
    $('orderNota').value = '';
    renderCart();
    showMsg('orderMsg', `✅ Pedido <strong>${num}</strong> confirmado correctamente`, 'success');
    setTimeout(() => clearMsg('orderMsg'), 6000);
    await loadClientOrders();
  } catch(e) {
    showMsg('orderMsg', e.message || 'Error al confirmar pedido', 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar pedido';
  }
}

async function loadClientOrders() {
  const cont = $('clientOrders');
  if (!cont) return;
  cont.innerHTML = '<div class="loader"></div>';
  const pedidos = await dbPedidosUser(G.userId);
  if (!pedidos.length) { cont.innerHTML = '<div class="cart-empty" style="padding:2rem"><span class="egg-empty">📋</span>Aún no tienes pedidos</div>'; return; }
  cont.innerHTML = pedidos.map(p => `
    <div class="order-card ${p.status==='Entregado'?'delivered':''}">
      <div class="order-meta">
        <div>

async function renderAdminTab(tab) {

function renderChartDir() {
  const canvas = $('chartDir');
  if (!canvas) return;
  const mapa = new Map();
  G.ventasAll.forEach(v => {
    const d = fmtDateShort(v.fecha);
    mapa.set(d, (mapa.get(d)||0) + v.total);
  });
  const sorted = Array.from(mapa.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  if (G.chartDir) G.chartDir.destroy();
  G.chartDir = new Chart(canvas, {
    type: 'bar',
    data: { labels: sorted.map(e=>e[0]), datasets: [{ label: 'Ventas directas', data: sorted.map(e=>e[1]), backgroundColor: 'rgba(184,113,42,0.75)', borderRadius: 4 }] },
    options: { responsive:true, maintainAspectRatio:true, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>pesos(v)}}} }
  });
}

function renderChartPed() {
  const canvas = $('chartPed');
  if (!canvas) return;
  const periodo   = $('periodoFilter')?.value || 'todo';
  const filtrados = filterByPeriod(G.pedidosAll, periodo);
  const mapa = new Map();
  filtrados.forEach(p => {
    const d = fmtDateShort(p.fecha);
    mapa.set(d, (mapa.get(d)||0) + p.total);
  });
  const sorted = Array.from(mapa.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  if (G.chartPed) G.chartPed.destroy();
  G.chartPed = new Chart(canvas, {
    type: 'bar',
    data: { labels: sorted.map(e=>e[0]), datasets: [{ label: 'Pedidos app', data: sorted.map(e=>e[1]), backgroundColor: 'rgba(59,107,59,0.75)', borderRadius: 4 }] },

  G.pedidosAll.forEach(p => csv += `"${p.invoice_number}","${fmtDate(p.fecha)}","${p.user_id}","${p.total}","${p.status}","${p.payment_method}"\n`);

  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));

      </div>
      <div class="invoice-section"><h4>Detalle</h4>
        <table class="invoice-table"><thead><tr><th>Producto</th><th>Cant.</th><th>P.Unit</th><th>Subtotal</th></tr></thead><tbody>
          ${(p.items||[]).map(i=>`<tr><td>Cubeta 24 huevos</td><td>${i.cant}</td><td>${pesos(i.precio)}</td><td>${pesos(i.sub)}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div class="invoice-total">Total: ${pesos(p.total)}</div>
      <div class="invoice-footer">IVA exento — Art. 424 E.T.</div>
    </div>`;
  $('invoiceModal').classList.remove('hidden');
};

// ---- Usuarios ----
async function renderAdminUsuarios(cont) {
  G.usersAll = await dbAllUsers();
  cont.innerHTML = `<div class="card">
    <div class="card-title">👥 Gestión de usuarios <small>${G.usersAll.length} total</small></div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr><th>Nombre</th><th>Email</th><th>Tipo</th><th>Admin</th><th>Acciones</th></tr></thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
    <div id="usersMsg" style="margin-top:0.5rem"></div>
  </div>`;

  const tipos = ['natural','negocio','empresa','restaurante','comida_rapida','pizzeria','bodega','otro_negocio'];
  $('usersTableBody').innerHTML = G.usersAll.map(u=>`<tr>
    <td><input id="un_${u.user_id}" value="${u.nombre||''}"></td>
    <td style="color:var(--c-muted);font-size:0.85rem">${u.email||''}</td>
    <td><select id="ut_${u.user_id}">${tipos.map(t=>`<option value="${t}" ${u.tipo===t?'selected':''}>${t}</option>`).join('')}</select></td>
    <td style="text-align:center"><input type="checkbox" id="ua_${u.user_id}" ${u.es_admin?'checked':''}></td>
    <td style="display:flex;gap:0.35rem;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="adminSaveUser('${u.user_id}')"><i class="fas fa-save"></i></button>
      <button class="btn btn-danger btn-sm" onclick="adminDeleteUser('${u.user_id}')"><i class="fas fa-trash"></i></button>
    </td>
  </tr>`).join('');
}

window.adminSaveUser = async (uid) => {
  const nombre   = $(`un_${uid}`).value.trim();
  const tipo     = $(`ut_${uid}`).value;
  const es_admin = $(`ua_${uid}`).checked;
  try {
    await dbUpdateUser(uid, { nombre, tipo, es_admin });
    showMsg('usersMsg', '✅ Usuario actualizado', 'success');
  } catch(e) { showMsg('usersMsg', e.message, 'error'); }
};

window.adminDeleteUser = async (uid) => {
  if (!confirm('¿Eliminar usuario? Esta acción no se puede deshacer.')) return;
  try {
    await dbDeleteUser(uid);
    G.usersAll = await dbAllUsers();
    await renderAdminTab('usuarios');
  } catch(e) { alert(e.message); }
};

// ---- Sugerencias ----
async function renderAdminSugerencias(cont) {
  const sugs = await dbAllSuggs();
  cont.innerHTML = `<div class="card">
    <div class="card-title">💬 Buzón de sugerencias <small>${sugs.length} mensajes</small></div>
    ${sugs.length ? sugs.map(s=>`<div class="sug-card">
      <div style="font-weight:600">${s.nombre||'Anónimo'} ${s.email?`<span style="font-weight:400;font-size:0.85rem;color:var(--c-muted)">· ${s.email}</span>`:''}</div>
      <p style="margin-top:0.35rem">${s.mensaje}</p>
      <div class="sug-meta">${fmtDate(s.fecha)}</div>
    </div>`).join('') : '<div class="cart-empty" style="padding:1.5rem">Sin sugerencias aún</div>'}
  </div>`;
}

// ---- Respaldo ----
function renderAdminRespaldo(cont) {
  cont.innerHTML = `<div class="card">
    <div class="card-title">💾 Respaldo de datos</div>
    <p style="margin-bottom:1rem;color:var(--c-muted)">Exporta todos los datos de la aplicación en formato JSON para respaldar la información.</p>
    <div style="display:flex;flex-wrap:wrap;gap:0.75rem">
      <button class="btn btn-primary" id="exportJsonBtn"><i class="fas fa-download"></i> Exportar JSON completo</button>
      <button class="btn btn-ghost" id="exportPedidosCsvBtn"><i class="fas fa-file-csv"></i> CSV pedidos</button>
      <button class="btn btn-ghost" id="exportVentasCsvBtn"><i class="fas fa-file-csv"></i> CSV ventas directas</button>
    </div>
    <div id="backupMsg" style="margin-top:0.75rem"></div>
    <div style="margin-top:1.5rem">
      <div class="card-title" style="border-top:1px dashed var(--c-border);padding-top:1rem;margin-top:0.5rem">🖼️ Logo personalizado</div>
      <div class="logo-upload" onclick="$('logoFileInput').click()">
        ${G.logoUrl ? `<img src="${G.logoUrl}" class="logo-preview">` : '<i class="fas fa-image" style="font-size:2rem;color:var(--c-muted)"></i>'}
        <p style="margin-top:0.5rem;color:var(--c-muted);font-size:0.9rem">Haz clic para cambiar el logo</p>
      </div>
    </div>
  </div>`;

  $('exportJsonBtn').onclick = async () => {
    const data = {
      fecha_exportacion: new Date().toISOString(),
      usuarios: await dbAllUsers(),
      pedidos: await dbAllPedidos(),
      ventas_directas: await dbAllVentas(),
      sugerencias: await dbAllSuggs(),
    };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `respaldo_granja_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    showMsg('backupMsg', '✅ Respaldo exportado exitosamente', 'success');
  };

  $('exportPedidosCsvBtn').onclick = async () => {
    const ped = await dbAllPedidos();
    let csv = 'Factura,Fecha,Total,Estado,Pago,Cubetas\n';
    ped.forEach(p=>csv+=`"${p.invoice_number}","${fmtDate(p.fecha)}","${p.total}","${p.status}","${p.payment_method}","${(p.items||[]).reduce((s,i)=>s+i.cant,0)}"\n`);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='pedidos.csv'; a.click();
  };

  $('exportVentasCsvBtn').onclick = async () => {
    const ven = await dbAllVentas();
    let csv = 'Fecha,Tipo,Cantidad,P.Unitario,Total\n';
    ven.forEach(v=>csv+=`"${fmtDate(v.fecha)}","${v.tipo_nombre}","${v.cant}","${v.precio_unitario}","${v.total}"\n`);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='ventas_directas.csv'; a.click();
  };
}

// =================================================================
//  BOOT
// =================================================================
(async function boot() {
  initModals();

  const { data: { session } } = await window.supabase.auth.getSession();
  if (!session) {
    $('authPage').style.display = '';
    initAuthPage();
    return;
  }

  // Carga perfil
  try {
    G.userId = session.user.id;
    const profile = await dbProfile(G.userId);
    G.tipo      = profile.tipo;
    G.esAdmin   = profile.es_admin;
    G.nombre    = profile.nombre;
    G.email     = profile.email;
    G.documento = profile.documento || '';
    G.direccion = profile.direccion || '';
  } catch(e) {
    // Sin perfil — pedir completar
    $('authPage').style.display = '';
    initAuthPage();
    return;
  }

  $('authPage').style.display = 'none';

  if (G.esAdmin) {
    $('adminPage').classList.add('active');
    await initAdminPage();
  } else {
    $('clientPage').classList.add('active');
    initClientPage();
  }
})();
</script>
</body>
