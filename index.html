<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Granja Villa Myriam · Emelina</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ========== ESTILOS COMPLETOS (iguales que el original, no se modifican) ========== */
:root {
  --c-bg:       #f7f2e8;
  --c-paper:    #fdfaf3;
  --c-cream:    #fff8ec;
  --c-amber:    #b8712a;
  --c-amber2:   #d4903f;
  --c-amber3:   #e8b870;
  --c-pale:     #f2ddb5;
  --c-brown:    #4a2c0e;
  --c-brown2:   #7a4a20;
  --c-brown3:   #a06c3a;
  --c-green:    #3b6b3b;
  --c-red:      #9b2a1a;
  --c-blue:     #2c7da0;
  --c-muted:    #8a6840;
  --c-border:   #d9c49a;
  --c-shadow:   rgba(74,44,14,0.12);
  --r:          1.1rem;
  --r-sm:       0.65rem;
  --font-head:  'Playfair Display', Georgia, serif;
  --font-body:  'Crimson Pro', Georgia, serif;
  --font-mono:  'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  font-size: 1.05rem;
  color: var(--c-brown);
  background: var(--c-bg);
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='0.6' fill='%23b8712a' opacity='0.07'/%3E%3C/svg%3E");
  min-height: 100vh;
}
h1,h2,h3,h4,h5 { font-family: var(--font-head); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--c-bg); }
::-webkit-scrollbar-thumb { background: var(--c-pale); border-radius: 3px; }
.page { min-height: 100vh; display: flex; flex-direction: column; }
#authPage { background: linear-gradient(160deg, #1c0f05 0%, #3a1e06 45%, #6b3c14 100%); position: relative; overflow: hidden; }
#authPage::before { content: ''; position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='40' cy='40' r='1' fill='%23e8b870' opacity='0.15'/%3E%3C/svg%3E"); pointer-events: none; }
#clientPage, #adminPage { display: none; flex-direction: column; }
#clientPage.active, #adminPage.active { display: flex; }
.auth-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; gap: 2rem; }
.auth-brand { text-align: center; color: var(--c-pale); }
.auth-brand img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; display: block; margin: 0 auto 0.5rem; animation: float 3s ease-in-out infinite; }
.auth-brand h1 { font-size: 1.8rem; font-style: italic; color: var(--c-amber3); }
.auth-brand p { font-size: 1rem; opacity: 0.75; margin-top: 0.2rem; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.auth-card { background: var(--c-paper); border-radius: 1.5rem; padding: 2.5rem 2rem; width: 100%; max-width: 500px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); border: 1px solid rgba(232,184,112,0.2); }
.auth-tabs { display: flex; gap: 0.25rem; background: var(--c-bg); border-radius: 3rem; padding: 0.2rem; margin-bottom: 2rem; }
.auth-tab { flex: 1; border: none; background: none; padding: 0.6rem 1rem; border-radius: 2.5rem; font-family: var(--font-body); font-size: 1rem; font-weight: 600; cursor: pointer; color: var(--c-muted); transition: all .2s; }
.auth-tab.active { background: var(--c-amber); color: white; box-shadow: 0 2px 12px rgba(184,113,42,0.35); }
.form-row { display: grid; gap: 0.85rem; margin-bottom: 0.85rem; }
.form-row.c2 { grid-template-columns: 1fr 1fr; }
.fg { display: flex; flex-direction: column; gap: 0.3rem; }
.fg label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--c-brown3); }
.fg input, .fg select, .fg textarea { padding: 0.65rem 0.9rem; border: 1.5px solid var(--c-border); border-radius: var(--r-sm); font-family: var(--font-body); font-size: 1rem; background: white; color: var(--c-brown); transition: border-color .2s, box-shadow .2s; outline: none; width: 100%; }
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--c-amber2); box-shadow: 0 0 0 3px rgba(184,113,42,0.12); }
.fg textarea { resize: vertical; min-height: 80px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; padding: 0.65rem 1.4rem; border: none; border-radius: 3rem; font-family: var(--font-body); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--c-amber); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--c-brown2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(184,113,42,0.4); }
.btn-success { background: var(--c-green); color: white; }
.btn-success:hover:not(:disabled) { background: #2d5430; transform: translateY(-1px); }
.btn-danger { background: var(--c-red); color: white; }
.btn-danger:hover:not(:disabled) { background: #7a1f10; }
.btn-info { background: var(--c-blue); color: white; }
.btn-info:hover:not(:disabled) { background: #1f5e7a; }
.btn-ghost { background: var(--c-pale); color: var(--c-brown2); }
.btn-ghost:hover:not(:disabled) { background: var(--c-border); }
.btn-outline { background: transparent; border: 1.5px solid var(--c-amber); color: var(--c-amber); }
.btn-outline:hover:not(:disabled) { background: var(--c-amber); color: white; }
.btn-block { width: 100%; }
.btn-sm { padding: 0.35rem 0.85rem; font-size: 0.85rem; }
.btn-xs { padding: 0.22rem 0.6rem; font-size: 0.78rem; }
.alert { padding: 0.6rem 1rem; border-radius: var(--r-sm); font-size: 0.92rem; margin-top: 0.5rem; }
.alert-error   { background: #fdf0ee; color: var(--c-red); border: 1px solid #f5c6c1; }
.alert-success { background: #edf7ed; color: var(--c-green); border: 1px solid #b7dbb7; }
.alert-info    { background: #fef8ee; color: var(--c-amber); border: 1px solid var(--c-pale); }
.alert-warn    { background: #fff8e1; color: #7a5600; border: 1px solid #ffd54f; }
.topbar { background: var(--c-paper); border-bottom: 1.5px solid var(--c-border); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px var(--c-shadow); }
.topbar-inner { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
.topbar-brand { display: flex; align-items: center; gap: 0.75rem; }
.topbar-logo { width: 44px; height: 44px; border-radius: 50%; background: var(--c-pale); border: 2px solid var(--c-amber); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; overflow: hidden; cursor: pointer; }
.topbar-title { font-family: var(--font-head); font-size: 1.1rem; font-style: italic; color: var(--c-brown); }
.topbar-sub { font-size: 0.75rem; color: var(--c-muted); text-transform: capitalize; }
.topbar-actions { display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap; }
.tab-nav { background: var(--c-paper); border-bottom: 1.5px solid var(--c-border); overflow-x: auto; scrollbar-width: none; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-nav-inner { display: flex; padding: 0 1.25rem; min-width: max-content; }
.tab-btn { background: none; border: none; border-bottom: 2.5px solid transparent; padding: 0.8rem 1.1rem; font-family: var(--font-body); font-size: 1rem; font-weight: 600; color: var(--c-muted); cursor: pointer; transition: all .2s; white-space: nowrap; }
.tab-btn.active { color: var(--c-amber); border-bottom-color: var(--c-amber); }
.tab-btn:hover:not(.active) { color: var(--c-brown2); }
.main { flex: 1; padding: 1.5rem; max-width: 1200px; margin: 0 auto; width: 100%; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: var(--c-paper); border-radius: var(--r); border: 1.5px solid var(--c-border); padding: 1.5rem; box-shadow: 0 2px 20px var(--c-shadow); margin-bottom: 1.25rem; }
.card-title { font-family: var(--font-head); font-size: 1.15rem; font-weight: 700; color: var(--c-brown); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px dashed var(--c-border); padding-bottom: 0.6rem; flex-wrap: wrap; }
.card-title small { font-family: var(--font-body); font-weight: 400; font-size: 0.85rem; color: var(--c-muted); margin-left: auto; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.price-display { background: linear-gradient(135deg, #fdf5e0, #f5e4b8); border: 1.5px solid var(--c-amber3); border-radius: var(--r-sm); padding: 1rem; text-align: center; margin: 0.75rem 0; }
.price-big { font-family: var(--font-head); font-size: 2rem; font-weight: 700; color: var(--c-brown); }
.price-label { font-size: 0.8rem; color: var(--c-muted); margin-top: 0.15rem; }
.price-rule { font-size: 0.82rem; color: var(--c-amber); margin-top: 0.3rem; font-style: italic; min-height: 1.2em; }
.total-bar { background: var(--c-pale); border-radius: var(--r-sm); padding: 0.7rem 1rem; display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin: 0.5rem 0; font-size: 1.05rem; }
.total-bar .total-num { font-family: var(--font-head); font-size: 1.2rem; color: var(--c-brown); }
.promo-banner { background: linear-gradient(95deg, #fff4d6, #ffeab5); border-left: 5px solid var(--c-amber2); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 0.75rem 1.1rem; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.6rem; font-weight: 600; color: var(--c-brown2); font-size: 0.95rem; }
.cart-empty { text-align: center; padding: 2.5rem 1rem; color: var(--c-muted); font-style: italic; font-size: 1.1rem; }
.cart-empty .egg-empty { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; opacity: 0.4; }
.cart-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px dashed var(--c-border); }
.cart-row:last-of-type { border-bottom: none; }
.cart-total { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: var(--c-pale); border-radius: var(--r-sm); font-weight: 700; margin-top: 0.5rem; }
.order-card { background: var(--c-cream); border: 1.5px solid var(--c-border); border-radius: var(--r-sm); padding: 0.9rem 1rem 0.9rem 1.3rem; margin-bottom: 0.75rem; position: relative; transition: box-shadow .2s; }
.order-card:hover { box-shadow: 0 4px 16px var(--c-shadow); }
.order-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c-amber3); border-radius: 4px 0 0 4px; }
.order-card.delivered::before { background: var(--c-green); }
.order-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; flex-wrap: wrap; }
.order-num { font-family: var(--font-mono); font-size: 0.88rem; font-weight: 600; color: var(--c-brown2); }
.order-date { font-size: 0.8rem; color: var(--c-muted); }
.order-total { font-family: var(--font-head); font-weight: 700; color: var(--c-brown); }
.badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.18rem 0.6rem; border-radius: 2rem; font-size: 0.72rem; font-weight: 700; }
.badge-pending   { background: #fef3e0; color: var(--c-amber); border: 1px solid var(--c-pale); }
.badge-delivered { background: #e0f0e8; color: var(--c-green); border: 1px solid #b7dbb7; }
.badge-pagado    { background: #d4e7f0; color: var(--c-blue); border: 1px solid #9bc0d0; }
.badge-canceled  { background: #f1e0dd; color: var(--c-red); border: 1px solid #f5c6c1; }
.badge-admin     { background: #e8e0ff; color: #4a2b7a; border: 1px solid #c5b8ee; }
.meta-hero { background: linear-gradient(145deg, #1c0f05, #3a1e06, #5a2e0a); border-radius: var(--r); padding: 2rem; color: white; margin-bottom: 1.25rem; position: relative; overflow: hidden; }
.meta-hero::after { content: ''; position: absolute; right: -20px; top: -20px; width: 180px; height: 180px; background: radial-gradient(circle, rgba(232,184,112,0.15), transparent); border-radius: 50%; pointer-events: none; }
.meta-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--c-amber3); opacity: 0.85; }
.meta-goal { font-family: var(--font-head); font-size: 2.2rem; font-weight: 700; color: var(--c-amber3); margin: 0.3rem 0; }
.meta-progress { background: rgba(255,255,255,0.12); border-radius: 2rem; height: 12px; overflow: hidden; margin: 1rem 0; }
.meta-fill { height: 100%; background: linear-gradient(90deg, var(--c-amber), var(--c-amber3), #f5c542); border-radius: 2rem; transition: width 1s ease; width: 0%; }
.meta-row { display: flex; justify-content: space-between; align-items: center; }
.meta-pct { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; }
.meta-figure { font-size: 2rem; }
.stat-card { background: var(--c-cream); border: 1.5px solid var(--c-border); border-radius: var(--r-sm); padding: 1rem; text-align: center; transition: transform 0.2s; }
.stat-card:hover { transform: translateY(-2px); }
.stat-val { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; color: var(--c-amber); }
.stat-label { font-size: 0.8rem; color: var(--c-muted); margin-top: 0.2rem; }
.data-table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; min-width: 520px; }
.data-table th { background: var(--c-pale); padding: 0.55rem 0.7rem; text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-brown2); white-space: nowrap; }
.data-table td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--c-border); font-size: 0.92rem; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--c-cream); }
.data-table input, .data-table select { padding: 0.3rem 0.5rem; border: 1.5px solid var(--c-border); border-radius: var(--r-sm); font-family: var(--font-body); font-size: 0.9rem; background: white; width: 100%; }
.modal-overlay { position: fixed; inset: 0; background: rgba(26,13,3,0.76); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
.modal-box { background: var(--c-paper); border-radius: var(--r); padding: 2rem; max-width: 580px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 40px 100px rgba(0,0,0,0.5); border: 1.5px solid var(--c-border); }
.modal-title { font-family: var(--font-head); font-size: 1.3rem; font-style: italic; color: var(--c-brown); margin-bottom: 1.25rem; border-bottom: 1px dashed var(--c-border); padding-bottom: 0.75rem; }
.modal-actions { display: flex; gap: 0.6rem; margin-top: 1.25rem; flex-wrap: wrap; }
.hidden { display: none !important; }
.invoice-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 2px solid var(--c-pale); }
.invoice-brand { font-family: var(--font-head); font-size: 1.25rem; font-style: italic; }
.invoice-num { font-family: var(--font-mono); font-size: 0.88rem; text-align: right; color: var(--c-muted); }
.invoice-section { margin-bottom: 1rem; }
.invoice-section h4 { font-family: var(--font-head); font-size: 0.95rem; color: var(--c-brown2); margin-bottom: 0.4rem; }
.invoice-table { width: 100%; border-collapse: collapse; }
.invoice-table th { background: var(--c-pale); padding: 0.4rem 0.6rem; text-align: left; font-size: 0.8rem; text-transform: uppercase; }
.invoice-table td { padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--c-border); font-size: 0.9rem; }
.invoice-total { text-align: right; font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; margin-top: 0.75rem; color: var(--c-brown); }
.invoice-footer { margin-top: 1rem; font-size: 0.8rem; color: var(--c-muted); text-align: center; border-top: 1px dashed var(--c-border); padding-top: 0.75rem; font-style: italic; }
@media print { body>*:not(#invoiceModal){display:none!important} .modal-overlay{position:static;background:none;} .modal-box{box-shadow:none;border:none;padding:0;} .modal-actions{display:none;} }
.app-footer { background: var(--c-paper); border-top: 1.5px solid var(--c-border); padding: 0.7rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
.footer-copy { font-size: 0.78rem; color: var(--c-muted); font-style: italic; }
.footer-links { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.logo-upload { text-align: center; padding: 1.5rem; border: 2px dashed var(--c-border); border-radius: var(--r-sm); cursor: pointer; transition: border-color 0.2s; }
.logo-upload:hover { border-color: var(--c-amber); }
.logo-preview { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--c-amber); margin: 0 auto 0.75rem; display: block; }
.qr-box { background: var(--c-cream); border: 1.5px dashed var(--c-amber3); border-radius: var(--r-sm); padding: 1rem; text-align: center; margin-top: 0.75rem; color: var(--c-muted); }
.qr-box i { font-size: 2.5rem; color: var(--c-amber); }
.loader { display: flex; align-items: center; justify-content: center; padding: 3rem; }
.loader::after { content: ''; width: 36px; height: 36px; border: 3px solid var(--c-pale); border-top-color: var(--c-amber); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.filter-bar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
.chip { padding: 0.28rem 0.75rem; border-radius: 2rem; border: 1.5px solid var(--c-border); background: white; font-family: var(--font-body); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
.chip.active { background: var(--c-amber); border-color: var(--c-amber); color: white; }
.sug-card { background: var(--c-cream); border: 1.5px solid var(--c-border); border-radius: var(--r-sm); padding: 0.85rem 1rem; margin-bottom: 0.65rem; }
.sug-meta { font-size: 0.8rem; color: var(--c-muted); margin-top: 0.35rem; }
.notification-banner { background: #fff3cd; border-left: 6px solid #ffc107; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: var(--r-sm); display: flex; align-items: center; gap: 0.75rem; font-weight: 600; color: #856404; }
.notification-banner i { font-size: 1.4rem; }
@media(max-width:768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .form-row.c2 { grid-template-columns: 1fr; }
  .auth-card { padding: 1.75rem 1.25rem; }
  .main { padding: 1rem; }
  .topbar-inner { padding: 0.6rem 1rem; }
  .meta-goal { font-size: 1.6rem; }
}
</style>
</head>
<body>

<!-- AUTH PAGE (exactamente igual que el original) -->
<div id="authPage" class="page">
  <div class="auth-wrap">
    <div class="auth-brand">
      <img src="logo.svg" alt="Logo Granja Villa Myriam" id="authLogoImg" onerror="this.style.display='none';this.parentElement.querySelector('.auth-logo-emoji').style.display='block';">
      <span class="auth-logo-emoji" style="display:none;">🥚</span>
      <h1>Granja Villa Myriam / Emelina</h1>
      <p>Huevos de Codorniz · Cubetas de 24 unidades</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLoginBtn">Iniciar sesión</button>
        <button class="auth-tab" id="tabRegisterBtn">Registrarse</button>
      </div>
      <div id="loginPanel">
        <div class="form-row">
          <div class="fg"><label>Correo electrónico</label><input type="email" id="loginEmail" placeholder="correo@ejemplo.com" autocomplete="email"></div>
          <div class="fg"><label>Contraseña</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
        </div>
        <div id="loginErr"></div>
        <button class="btn btn-primary btn-block mt-1" id="loginBtn">Ingresar</button>
      </div>
      <div id="registerPanel" class="hidden">
        <div class="form-row">
          <div class="fg"><label>Tipo de cliente</label>
            <select id="regTipo">
              <option value="natural">Persona Natural</option>
              <option value="negocio">Negocio</option>
              <option value="empresa">Empresa</option>

    return `${dd} ${mo} ${yy}, ${hh}:${mi}`;

  $('payMethod').addEventListener('change', () => $('qrBox').classList.toggle('hidden', $('payMethod').value === 'efectivo'));
  $('addCartBtn').onclick = addToCart;
  $('confirmOrderBtn').onclick = confirmOrder;
}
function updateClientPrice() {
  const cant = parseInt($('clientCant').value) || 0;
  const p = calcPrecio(G.tipo, cant);
  $('clientPrecio').textContent = pesos(p);
  $('clientPriceRule').textContent = calcRuleText(G.tipo, cant);
  $('clientTotal').textContent = pesos(cant * p);
}
function addToCart() {
  const cant = parseInt($('clientCant').value);
  if (!cant || cant < 1 || cant > 500) { showMsg('orderMsg', 'Ingresa una cantidad válida entre 1 y 500', 'warn'); return; }
  const p = calcPrecio(G.tipo, cant);
  G.carrito.push({ cant, precio: p, sub: cant * p });
  $('clientCant').value = 1;
  updateClientPrice();
  renderCart();
  clearMsg('orderMsg');
}
function renderCart() {
  const cont = $('cartContent');
  if (!G.carrito.length) {
    cont.innerHTML = '<div class="cart-empty"><span class="egg-empty">🥚</span>Tu carrito está vacío</div>';
    $('cartCount').textContent = '0 cubetas';
    return;
  }
  let total = 0, rows = '';
  G.carrito.forEach((item, i) => {
    total += item.sub;
    rows += `<div class="cart-row"><div><strong>${item.cant}</strong> cubeta${item.cant>1?'s':''} × ${pesos(item.precio)}</div><div style="display:flex;align-items:center;gap:.4rem"><strong>${pesos(item.sub)}</strong><button class="btn btn-ghost btn-xs" onclick="removeFromCart(${i})" title="Quitar"><i class="fas fa-times"></i></button></div></div>`;
  });
  cont.innerHTML = rows + `<div class="cart-total"><span>Total</span><span style="font-family:var(--font-head);font-size:1.2rem">${pesos(total)}</span></div>`;
  const tc = G.carrito.reduce((s,i) => s + i.cant, 0);
  $('cartCount').textContent = `${tc} cubeta${tc>1?'s':''}`;
}
window.removeFromCart = i => { G.carrito.splice(i,1); renderCart(); };

async function confirmOrder() {
  if (!G.carrito.length) { showMsg('orderMsg', 'Agrega al menos un item al carrito', 'warn'); return; }
  const btn = $('confirmOrderBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando…';
  clearMsg('orderMsg');
  try {
    const total = G.carrito.reduce((s,i) => s + i.sub, 0);
    const paymentMethod = $('payMethod').value;
    const nota = $('orderNota').value.trim();
    let success = false;
    let attempts = 0;
    const MAX_ATTEMPTS = 3;
    while (!success && attempts < MAX_ATTEMPTS) {
      const num = genInvoiceNumber();
      try {
        await dbCreatePedido({
          invoice_number: num, user_id: G.userId,
          items: JSON.parse(JSON.stringify(G.carrito)), total,
          payment_method: paymentMethod, status: 'Pendiente',
          nota, fecha: new Date().toISOString()
        });
        success = true;
        G.carrito = [];
        $('orderNota').value = '';
        renderCart();
        showMsg('orderMsg', `✅ Pedido <strong>${num}</strong> confirmado. ¡Gracias!`, 'success');
        setTimeout(() => clearMsg('orderMsg'), 8000);
      } catch(e) {
        if (e.message && e.message.includes('duplicate key')) {
          attempts++;
          if (attempts >= MAX_ATTEMPTS) throw new Error('No se pudo generar un número de factura único. Por favor reintenta.');
          await new Promise(r => setTimeout(r, 100));
        } else {
          throw e;
        }
      }
    }
  } catch(e) { showMsg('orderMsg', '❌ ' + (e.message || 'Error al confirmar'), 'error'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar pedido'; }
}

async function loadClientOrders() {
  const cont = $('clientOrders');
  if (!cont) return;
  cont.innerHTML = '<div class="loader"></div>';
  try {
    const pedidos = await dbPedidosUser(G.userId);
    if (!pedidos.length) { cont.innerHTML = '<div class="cart-empty" style="padding:2rem"><span class="egg-empty">📋</span>Aún no tienes pedidos</div>'; return; }
    const ahora = new Date();
    const hayEntregados = pedidos.some(p => p.status === 'Entregado');
    let notifHtml = '';
    if (hayEntregados) {
      notifHtml = `<div class="notification-banner"><i class="fas fa-truck"></i> <span>⚠️ Tienes pedidos entregados pendientes de pago. Por favor, realiza el pago lo antes posible.</span></div>`;
    }
    cont.innerHTML = notifHtml + pedidos.map(p => {
      const fechaPedido = new Date(p.fecha);
      const diffMin = (ahora - fechaPedido) / (1000 * 60);
      const puedeCancelar = (p.status === 'Pendiente' && diffMin <= 30);
      let badgeClass = '', badgeText = p.status;
      if (p.status === 'Pendiente') { badgeClass = 'badge-pending'; badgeText = 'Pendiente'; }
      else if (p.status === 'Entregado') { badgeClass = 'badge-delivered'; badgeText = 'Entregado - Pago pendiente'; }
      else if (p.status === 'Pagado') { badgeClass = 'badge-pagado'; badgeText = 'Pagado'; }
      else if (p.status === 'Cancelado') { badgeClass = 'badge-canceled'; badgeText = 'Cancelado'; }
      return `
      <div class="order-card">
        <div class="order-meta">
          <div><span class="order-num">${escAttr(p.invoice_number)}</span><span class="badge ${badgeClass}" style="margin-left:.5rem">${badgeText}</span></div>
          <span class="order-date">${fmtDate(p.fecha)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;flex-wrap:wrap;gap:.35rem">
          <span style="color:var(--c-muted);font-size:.9rem">${p.payment_method || ''} · ${(p.items||[]).reduce((s,i)=>s+i.cant,0)} cubetas</span>
          <span class="order-total">${pesos(p.total)}</span>
        </div>
        ${p.nota ? `<div style="font-size:.82rem;color:var(--c-muted);margin-top:.3rem;font-style:italic">📝 ${escAttr(p.nota)}</div>` : ''}
        <div style="margin-top:.6rem;display:flex;gap:0.5rem;flex-wrap:wrap">

        </div>
      </div>`}).join('');
  } catch(e) { cont.innerHTML = `<div class="alert alert-error">Error al cargar pedidos: ${escHtml(e.message)}</div>`; }
}

function renderChartDir() {
  const canvas = $('chartDir');
  if (!canvas) return;
  const mapa = new Map();
  G.ventasAll.forEach(v => { const d = fmtDateShort(v.fecha); mapa.set(d, (mapa.get(d) || 0) + v.total); });
  const sorted = Array.from(mapa.entries()).sort((a,b) => a[0].localeCompare(b[0]));
  if (G.chartDir) G.chartDir.destroy();
  if (!sorted.length) { canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); return; }
  G.chartDir = new Chart(canvas, {
    type: 'bar',
    data: { labels: sorted.map(e=>e[0]), datasets: [{ label: 'Ventas directas', data: sorted.map(e=>e[1]), backgroundColor: 'rgba(184,113,42,0.75)', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => pesos(v) } } } }
  });
}

    type: 'bar',
    data: { labels: sorted.map(e=>e[0]), datasets: [{ label: 'Pedidos app', data: sorted.map(e=>e[1]), backgroundColor: 'rgba(59,107,59,0.75)', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => pesos(v) } } } }
  });
}

// ========== PEDIDOS (igual) ==========
async function renderAdminPedidos(cont) {
  cont.innerHTML = '<div class="loader">Cargando...</div>';
  try {
    const { data: pedidos, error } = await supabase.from('pedidos').select('*').order('fecha', { ascending: false });
    if (error) throw error;
    G.pedidosAll = pedidos || [];
    if (!G.pedidosAll.length) {
      cont.innerHTML = '<div class="card"><div class="cart-empty">No hay pedidos registrados</div></div>';
      return;
    }
    let html = `<div class="card"><div class="card-title">📦 Todos los pedidos (${G.pedidosAll.length})</div>
      <div class="filter-bar" id="pedFilterBarAdmin">
        <button class="chip active" data-status="todos">Todos</button>
        <button class="chip" data-status="Pendiente">Pendientes</button>
        <button class="chip" data-status="Entregado">Entregados</button>
        <button class="chip" data-status="Pagado">Pagados</button>
        <button class="chip" data-status="Cancelado">Cancelados</button>
      </div>
      <div id="adminPedidosList"></div>
    </div>`;
    cont.innerHTML = html;

    const renderList = (status) => {
      const list = status === 'todos' ? G.pedidosAll : G.pedidosAll.filter(p => p.status === status);
      const container = $('adminPedidosList');
      if (!container) return;
      if (!list.length) { container.innerHTML = '<div class="cart-empty">Sin pedidos</div>'; return; }
      container.innerHTML = list.map(p => {
        let badgeEstado = '';
        if (p.status === 'Pendiente') badgeEstado = 'badge-pending';
        else if (p.status === 'Entregado') badgeEstado = 'badge-delivered';
        else if (p.status === 'Pagado') badgeEstado = 'badge-pagado';
        else if (p.status === 'Cancelado') badgeEstado = 'badge-canceled';
        return `
        <div class="order-card">
          <div class="order-meta">
            <div><span class="order-num">${p.invoice_number}</span> <span class="badge ${badgeEstado}">${p.status === 'Entregado' ? 'Entregado - Pago pendiente' : p.status}</span></div>
            <span class="order-date">${fmtDate(p.fecha)}</span>
          </div>
          <div>${p.payment_method} · ${(p.items||[]).reduce((s,i)=>s+i.cant,0)} cubetas · ${pesos(p.total)}</div>
          ${p.nota ? `<div class="muted">📝 ${p.nota}</div>` : ''}
          <div style="margin-top:8px">
            ${p.status === 'Pendiente' ? `<button class="btn btn-info btn-sm" onclick="adminMarcarEntregado('${p.id}')">Marcar Entregado</button>` : ''}
            ${(p.status === 'Pendiente' || p.status === 'Entregado') ? `<button class="btn btn-success btn-sm" onclick="adminMarcarPagado('${p.id}')">Marcar Pagado</button>` : ''}
            ${p.status === 'Pendiente' ? `<button class="btn btn-danger btn-sm" onclick="adminCancelarPedido('${p.id}')">Cancelar</button>` : ''}
            <button class="btn btn-ghost btn-sm" onclick="adminVerFactura('${p.id}')">Factura</button>
          </div>
        </div>
      `}).join('');
    };

    const chips = cont.querySelectorAll('[data-status]');
    chips.forEach(chip => {
      chip.onclick = () => {
        chips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderList(chip.dataset.status);
      };
    });
    renderList('todos');

    window.adminVerFactura = (id) => {
      const p = G.pedidosAll.find(x => x.id == id);
      if (!p) return;
      let badgeEstado = '';
      if (p.status === 'Pendiente') badgeEstado = 'badge-pending';
      else if (p.status === 'Entregado') badgeEstado = 'badge-delivered';
      else if (p.status === 'Pagado') badgeEstado = 'badge-pagado';
      else if (p.status === 'Cancelado') badgeEstado = 'badge-canceled';
      $('invoiceContent').innerHTML = `<div class="invoice"><div class="invoice-header"><div><div class="invoice-brand">Granja Villa Myriam / Emelina</div><div>NIT: 900.123.456-7</div></div><div class="invoice-num">${p.invoice_number}<br>${fmtDate(p.fecha)}<br><span class="badge ${badgeEstado}">${p.status === 'Entregado' ? 'Entregado - Pago pendiente' : p.status}</span></div></div><div><h4>Detalle</h4><table class="invoice-table"><thead><tr><th>Producto</th><th>Cant.</th><th>P.Unit</th><th>Subtotal</th></tr></thead><tbody>${(p.items||[]).map(i=>`<tr><td>Cubeta 24 huevos</td><td>${i.cant}</td><td>${pesos(i.precio)}</td><td>${pesos(i.sub)}</td>`).join('')}</tbody></table></div><div class="invoice-total">Total: ${pesos(p.total)}</div><div class="invoice-footer">IVA exento — Art. 424 E.T.</div></div>`;
      $('invoiceModal').classList.remove('hidden');
    };
  } catch(e) {
    cont.innerHTML = `<div class="alert alert-error">Error: ${e.message}</div>`;
  }
}

// ========== USUARIOS (con aviso de políticas de envío) ==========
async function renderAdminUsuarios(cont) {
  cont.innerHTML = '<div class="loader">Cargando...</div>';
  try {
    const { data: users, error } = await supabase.from('usuarios').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    G.usersAll = users || [];
    if (!G.usersAll.length) {
      cont.innerHTML = '<div class="card"><div class="cart-empty">No hay usuarios registrados</div></div>';
      return;
    }
    let html = `
      <div class="card" style="background:#e6f4ea; border-left: 6px solid var(--c-green);">
        <div class="card-title">🚚 Políticas de envío</div>
        <p style="margin-bottom:0.5rem">✅ <strong>Ubaté:</strong> Envío gratis a partir de 2 cubetas.</p>
        <p style="margin-bottom:0.5rem">✅ <strong>Pueblos cercanos (Sutatausa, Cucunubá, Lenguazaque, etc.):</strong> Envío gratis si el pedido supera las 20 cubetas.</p>
        <p>⚠️ <strong>Otras ciudades o municipios:</strong> Los gastos de envío corren por cuenta del cliente (sujeto a cotización).</p>
      </div>
      <div class="card">
        <div class="card-title">👥 Gestión de usuarios (${G.usersAll.length})</div>
        <div class="data-table-wrap"><table class="data-table"><thead><tr><th>Nombre</th><th>Email</th><th>Tipo</th><th>Admin</th><th>Acciones</th></tr></thead><tbody>`;
    const tipos = ['natural','negocio','empresa','restaurante','comida_rapida','pizzeria','bodega','otro_negocio'];
    G.usersAll.forEach(u => {
      html += `
        <tr>
          <td><input id="un_${u.user_id}" value="${escAttr(u.nombre||'')}"></td>
          <td style="color:var(--c-muted);font-size:.85rem">${escAttr(u.email||'')}</td>
          <td><select id="ut_${u.user_id}">${tipos.map(t=>`<option value="${t}" ${u.tipo===t?'selected':''}>${t}</option>`).join('')}</select></td>
          <td><input type="checkbox" id="ua_${u.user_id}" ${u.es_admin?'checked':''}></td>
          <td><button class="btn btn-primary btn-sm" onclick="adminGuardarUsuario('${u.user_id}')">Guardar</button> <button class="btn btn-danger btn-sm" onclick="adminEliminarUsuario('${u.user_id}')">Eliminar</button></td>
        </tr>
      `;
    });
    cont.innerHTML = html + `</tbody></table></div><div id="usersAdminMsg"></div></div>`;
    window.adminGuardarUsuario = async (uid) => {
      const nombre = $(`un_${uid}`).value.trim();
      const tipo = $(`ut_${uid}`).value;
      const es_admin = $(`ua_${uid}`).checked;
      if (!nombre) { showMsg('usersAdminMsg', 'El nombre no puede estar vacío', 'error'); return; }
      try {
        await dbUpdateUser(uid, { nombre, tipo, es_admin });
        showMsg('usersAdminMsg', '✅ Usuario actualizado', 'success');
        setTimeout(() => clearMsg('usersAdminMsg'), 3000);
        await renderAdminTab('usuarios');
      } catch(e) { showMsg('usersAdminMsg', '❌ ' + e.message, 'error'); }
    };
    window.adminEliminarUsuario = async (uid) => {
      if (uid === G.userId) { alert('No puedes eliminarte a ti mismo'); return; }
      if (!confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')) return;
      try {
        await dbDeleteUser(uid);
        await renderAdminTab('usuarios');
      } catch(e) { alert('Error: ' + e.message); }
    };
  } catch(e) {
    cont.innerHTML = `<div class="alert alert-error">Error: ${e.message}</div>`;
  }
}

// ========== RESPALDO (con botón de soft delete) ==========
function renderAdminRespaldo(cont) {
  const logoActual = lsGet('granjaLogo');
  cont.innerHTML = `
    <div class="card">
      <div class="card-title">💾 Respaldo de datos</div>
      <div style="margin-bottom:1rem;color:var(--c-muted)">Exporta todos los datos en formato JSON o CSV.</div>
      <div style="display:flex;flex-wrap:wrap;gap:.75rem">
        <button class="btn btn-primary" id="exportJsonFull">JSON completo</button>
        <button class="btn btn-ghost" id="exportPedidosFull">CSV pedidos</button>
        <button class="btn btn-ghost" id="exportVentasFull">CSV ventas</button>
      </div>
      <div style="margin-top:1rem">
        <button class="btn btn-danger" id="softDeleteVentasBtn">🗑️ Marcar todas las ventas directas como eliminadas (soft delete)</button>
      </div>
      <div id="backupFullMsg" class="mt-1"></div>
    </div>
    <div class="card">
      <div class="card-title">🖼️ Logo personalizado</div>
      <div class="logo-upload" onclick="$('logoFileInput').click()">
        ${logoActual ? `<img src="${logoActual}" class="logo-preview">` : '<img src="logo.svg" class="logo-preview" onerror="this.outerHTML=\'<i class=\'fas fa-image\'></i>\'">'}
        <p>Haz clic para cambiar el logo</p>
      </div>
      ${logoActual ? `<button class="btn btn-ghost btn-sm mt-1" id="resetLogoFull">Restaurar logo original</button>` : ''}
    </div>
  `;

  // Exportaciones (igual)
  $('#exportJsonFull').onclick = async () => {
    const [usuarios, pedidos, ventas, sugerencias] = await Promise.all([
      supabase.from('usuarios').select('*'), supabase.from('pedidos').select('*'),
      supabase.from('ventas_directas').select('*'), supabase.from('sugerencias').select('*')
    ]);
    const data = { fecha: new Date().toISOString(), usuarios: usuarios.data || [], pedidos: pedidos.data || [], ventas_directas: ventas.data || [], sugerencias: sugerencias.data || [] };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `respaldo_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    showMsg('backupFullMsg', '✅ Respaldo exportado', 'success');
  };
  $('#exportPedidosFull').onclick = async () => {
    const { data } = await supabase.from('pedidos').select('*');
    if (!data || !data.length) { alert('No hay pedidos'); return; }
    let csv = 'Factura,Fecha,Total,Estado,Pago,Cubetas,Nota\n';
    data.forEach(p => csv += `"${p.invoice_number}","${fmtDate(p.fecha)}",${p.total},"${p.status}","${p.payment_method}","${(p.items||[]).reduce((s,i)=>s+i.cant,0)}","${p.nota||''}"\n`);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `pedidos_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  };
  $('#exportVentasFull').onclick = async () => {
    const { data } = await supabase.from('ventas_directas').select('*');
    if (!data || !data.length) { alert('No hay ventas directas'); return; }
    let csv = 'Fecha,Tipo,Cantidad,Precio Unitario,Total\n';
    data.forEach(v => csv += `"${fmtDate(v.fecha)}","${v.tipo_nombre}",${v.cant},${v.precio_unitario},${v.total}\n`);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `ventas_directas_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  };

  const resetBtn = $('#resetLogoFull');
  if (resetBtn) resetBtn.onclick = () => {
    lsSet('granjaLogo', '');
    ['clientTopLogo', 'adminTopLogo'].forEach(id => setLogoEl($(id)));
    renderAdminRespaldo(cont);
  };

  // Soft delete button
  $('#softDeleteVentasBtn').onclick = async () => {
    if (confirm('⚠️ Esta acción marcará TODAS las ventas directas como eliminadas. No se borrarán físicamente, pero dejarán de contarse en la meta y no se mostrarán en el panel. ¿Continuar?')) {
      try {
        await dbSoftDeleteAllVentas();
        alert('Ventas directas marcadas como eliminadas correctamente.');
        // Recargar la pestaña de ventas si está activa
        const activeTab = document.querySelector('#adminTabNav .tab-btn.active')?.dataset.atab;
        if (activeTab === 'ventas') await renderAdminTab('ventas');
        else await renderAdminTab('respaldo');
      } catch(e) {
        alert('Error: ' + e.message);
      }
    }
  };
}

// ========== SUPER ADMIN (igual) ==========
async function renderAdminAdmins(cont) {
  cont.innerHTML = '<div class="loader">Cargando...</div>';
  try {
    const { data: users } = await supabase.from('usuarios').select('*');
    const admins = (users || []).filter(u => u.es_admin === true);
    let html = '';
    if (!admins.length) {
      html = `<div class="card"><div class="cart-empty">No hay administradores</div><button class="btn btn-primary btn-sm mt-1" id="addAdminBtn">Agregar administrador</button><div id="adminsMsg"></div></div>`;
    } else {
      html = `<div class="card"><div class="card-title">👑 Gestión de administradores (${admins.length})</div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Nombre</th><th>Email</th><th>Acciones</th></tr></thead><tbody>`;
      admins.forEach(a => {
        html += `
          <tr>
            <td><input id="ad_name_${a.user_id}" value="${escAttr(a.nombre)}"></td>
            <td>${escAttr(a.email)}</td>
            <td><button class="btn btn-primary btn-sm" onclick="adminGuardarAdmin('${a.user_id}')">Guardar</button> ${a.user_id !== G.userId ? `<button class="btn btn-danger btn-sm" onclick="adminEliminarAdmin('${a.user_id}')">Eliminar</button>` : ''}</td>
          </tr>
        `;
      });
      html += `</tbody></table></div><button class="btn btn-primary btn-sm mt-2" id="addAdminBtn">Agregar administrador</button><div id="adminsMsg"></div></div>`;
    }
    cont.innerHTML = html;
    const addBtn = $('addAdminBtn');
    if (addBtn) {
      addBtn.onclick = async () => {
        const email = prompt('Correo electrónico del nuevo administrador:');
        if (!email) return;
        const nombre = prompt('Nombre completo:');
        if (!nombre) return;
        const pass = Math.random().toString(36).slice(2, 10);
        try {
          const { data, error } = await window.supabase.auth.signUp({ email, password: pass, options: { data: { nombre } } });
          if (error) throw error;
          await window.supabase.from('usuarios').update({ es_admin: true, nombre }).eq('user_id', data.user.id);
          alert(`Administrador creado. Contraseña temporal: ${pass}\nEl usuario deberá cambiar su contraseña después de iniciar sesión.`);
          await renderAdminTab('admins');
        } catch(e) { showMsg('adminsMsg', e.message, 'error'); }
      };
    }
    window.adminGuardarAdmin = async (uid) => {
      const nombre = $(`ad_name_${uid}`).value.trim();
      if (!nombre) { showMsg('adminsMsg', 'El nombre no puede estar vacío', 'error'); return; }
      try {
        await supabase.from('usuarios').update({ nombre }).eq('user_id', uid);
        showMsg('adminsMsg', '✅ Administrador actualizado', 'success');
        await renderAdminTab('admins');
      } catch(e) { showMsg('adminsMsg', e.message, 'error'); }
    };
    window.adminEliminarAdmin = async (uid) => {
      if (!confirm('¿Eliminar este administrador? Ya no podrá acceder como admin.')) return;
      try {
        await supabase.from('usuarios').update({ es_admin: false }).eq('user_id', uid);
        showMsg('adminsMsg', '✅ Administrador eliminado', 'success');
        await renderAdminTab('admins');
      } catch(e) { showMsg('adminsMsg', e.message, 'error'); }
    };
  } catch(e) {
    cont.innerHTML = `<div class="alert alert-error">Error: ${e.message}</div>`;
  }
}

// =================================================================
//  BOOT
// =================================================================
(async function boot() {
  initModals();
  const { data: { session } } = await window.supabase.auth.getSession();
  if (!session) { $('authPage').style.display = ''; initAuthPage(); return; }
  try {
    G.userId = session.user.id;
    const profile = await dbProfile(G.userId);
    G.tipo = profile.tipo || 'natural';
    G.esAdmin = profile.es_admin || false;
    G.nombre = profile.nombre || 'Usuario';
    G.email = profile.email || session.user.email || '';
    G.documento = profile.documento || '';
    G.direccion = profile.direccion || '';
    console.log('Perfil cargado:', G);
  } catch(e) {
    await window.supabase.auth.signOut();
    $('authPage').style.display = '';
    initAuthPage();
    showMsg('loginErr', 'Tu perfil no está disponible. Por favor regístrate de nuevo.', 'warn');
    return;
  }
  $('authPage').style.display = 'none';
  if (G.esAdmin) { $('adminPage').classList.add('active'); await initAdminPage(); }
  else { $('clientPage').classList.add('active'); initClientPage(); }
})();
</script>
