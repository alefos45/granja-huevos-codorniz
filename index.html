<!--
=================================================================
 SQL PARA SUPABASE — ejecutar en el SQL Editor de tu proyecto
=================================================================

-- 1. Tabla usuarios (si no existe)
create table if not exists public.usuarios (
  id          bigserial primary key,
  user_id     uuid references auth.users(id) on delete cascade unique not null,
  nombre      text not null,
  documento   text,
  email       text,
  direccion   text,
  telefono    text,
  whatsapp    text,
  tipo        text default 'natural',
  es_admin    boolean default false,
  created_at  timestamptz default now()
);

-- 2. Tabla pedidos
create table if not exists public.pedidos (
  id              bigserial primary key,
  invoice_number  text unique not null,
  user_id         uuid references auth.users(id) on delete cascade not null,
  items           jsonb not null,
  total           numeric not null,
  payment_method  text,
  status          text default 'Pendiente',
  nota            text,
  fecha           timestamptz default now()
);

-- 3. Tabla ventas_directas
create table if not exists public.ventas_directas (
  id               bigserial primary key,
  user_id          uuid references auth.users(id) on delete cascade not null,
  cant             integer not null,
  tipo_nombre      text,
  precio_unitario  numeric,
  total            numeric,
  nota             text,
  fecha            timestamptz default now()
);

-- 4. Tabla sugerencias
create table if not exists public.sugerencias (
  id       bigserial primary key,
  nombre   text,
  email    text,
  mensaje  text,
  fecha    timestamptz default now()
);

-- RLS
alter table public.usuarios        enable row level security;
alter table public.pedidos         enable row level security;
alter table public.ventas_directas enable row level security;
alter table public.sugerencias     enable row level security;

-- Políticas (ajustar según necesidades)
-- Usuarios: propio o admin
create policy "usuario_propio" on public.usuarios for all using (auth.uid() = user_id);
create policy "admin_todos_usuarios" on public.usuarios for all using (exists(select 1 from public.usuarios where user_id = auth.uid() and es_admin = true));

-- Pedidos: propio o admin
create policy "pedido_propio" on public.pedidos for all using (auth.uid() = user_id);
create policy "admin_todos_pedidos" on public.pedidos for all using (exists(select 1 from public.usuarios where user_id = auth.uid() and es_admin = true));

-- Ventas directas: solo admin
create policy "admin_ventas_directas" on public.ventas_directas for all using (exists(select 1 from public.usuarios where user_id = auth.uid() and es_admin = true));

-- Sugerencias: cualquiera inserta, solo admin lee
create policy "cualquiera_inserta" on public.sugerencias for insert with check (true);
create policy "admin_lee_sugerencias" on public.sugerencias for select using (exists(select 1 from public.usuarios where user_id = auth.uid() and es_admin = true));

-- TRIGGER AUTOMÁTICO (guarda todos los campos del formulario)
-- Eliminar si ya existe
drop trigger if exists on_auth_user_created on auth.users;
drop function if exists public.handle_new_user();

create or replace function public.handle_new_user()
returns trigger
language plpgsql
security definer
set search_path = public
as $$
begin
  insert into public.usuarios (
    user_id,
    nombre,
    documento,
    telefono,
    whatsapp,
    direccion,
    tipo,
    email,
    es_admin
  )
  values (
    new.id,
    coalesce(new.raw_user_meta_data->>'nombre', ''),
    coalesce(new.raw_user_meta_data->>'documento', ''),
    coalesce(new.raw_user_meta_data->>'telefono', ''),
    coalesce(new.raw_user_meta_data->>'whatsapp', ''),
    coalesce(new.raw_user_meta_data->>'direccion', ''),
    coalesce(new.raw_user_meta_data->>'tipo', 'natural'),
    new.email,
    false
  );
  return new;
end;
$$;

create trigger on_auth_user_created
  after insert on auth.users
  for each row execute function public.handle_new_user();

=================================================================
-->

function pesos(n) { return '$' + Number(n).toLocaleString('es-CO'); }
function fmtDate(d) {
  try {
    const dt = new Date(d);
    const dd = String(dt.getDate()).padStart(2,'0');
    const mo = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][dt.getMonth()];
    const yy = dt.getFullYear();
    const hh = String(dt.getHours()).padStart(2,'0');
    const mi = String(dt.getMinutes()).padStart(2,'0');
    return `${dd} ${mo} ${yy}, ${hh}:${mi}`;
  } catch(_) { return String(d); }
}
function fmtDateShort(d) {
  try {
    const dt = new Date(d);
    return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  } catch(_) { return String(d); }
}

function filterByPeriod(list, period, dateKey='fecha') {
  if (period === 'todo') return list;
  const now = Date.now(); let cutoff;
  if (period === '7d') cutoff = now - 7*86400000;
  else if (period === 'mes') { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); cutoff = d.getTime(); }
  else if (period === 'anio') cutoff = new Date(new Date().getFullYear(),0,1).getTime();
  else cutoff = 0;
  return list.filter(x => new Date(x[dateKey]).getTime() >= cutoff);
}

    if (!file) return;
    if (file.size > 3*1024*1024) { alert('El logo debe pesar menos de 3 MB.'); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      const url = ev.target.result;
      lsSet('granjaLogo', url);
      ['clientTopLogo','adminTopLogo'].forEach(id => {
        const el = $(id);
        if (el) el.innerHTML = `<img src="${escAttr(url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Logo">`;
      });
    };
    reader.readAsDataURL(file);
  };
}

  tR.onclick = () => { tR.classList.add('active'); tL.classList.remove('active'); pR.classList.remove('hidden'); pL.classList.add('hidden'); clearMsg('registerErr'); };
  [$('loginEmail'), $('loginPass')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); }));

  $('loginBtn').onclick = async () => {
    const btn = $('loginBtn');
    const email = $('loginEmail').value.trim();
    const pass = $('loginPass').value;
    if (!email || !pass) { showMsg('loginErr', 'Ingresa correo y contraseña', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Ingresando…';
    try {
      await dbLogin(email, pass);
      location.reload();
    } catch(e) { showMsg('loginErr', e.message || 'Error al iniciar sesión', 'error'); btn.disabled = false; btn.textContent = 'Ingresar'; }
  };

  $('registerBtn').onclick = async () => {
    const btn = $('registerBtn');
    const email = $('regEmail').value.trim();
    const pass = $('regPassword').value;
    const ud = {
      nombre: $('regNombre').value.trim(),
      documento: $('regDocumento').value.trim(),
      direccion: $('regDireccion').value.trim(),
      telefono: $('regTelefono').value.trim(),
      whatsapp: $('regWhatsapp').value.trim(),
      tipo: $('regTipo').value,
    };
    if (!email || !pass || !ud.nombre) { showMsg('registerErr', 'Nombre, correo y contraseña son obligatorios', 'error'); return; }
    if (pass.length < 6) { showMsg('registerErr', 'La contraseña debe tener al menos 6 caracteres', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Registrando…';
    try {
      await dbRegister(email, pass, ud);
      showMsg('registerErr', '✅ Cuenta creada. Por favor inicia sesión.', 'success');
      setTimeout(() => tL.click(), 1500);
    } catch(e) { showMsg('registerErr', e.message || 'Error al registrar', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Crear cuenta'; }
  };
  renderFooter('footerAuth');
}

function initClientOrderPanel() {
  $('promoText').textContent = calcPromoText(G.tipo);
  updateClientPrice();
  $('clientCant').addEventListener('input', updateClientPrice);
  $('payMethod').addEventListener('change', () => $('qrBox').classList.toggle('hidden', $('payMethod').value === 'efectivo'));
  $('addCartBtn').onclick = addToCart;
  $('confirmOrderBtn').onclick = confirmOrder;
}
function updateClientPrice() {
  const cant = parseInt($('clientCant').value) || 0;
  const p = calcPrecio(G.tipo, cant);
  $('clientPrecio').textContent = pesos(p);
  $('clientPriceRule').textContent = calcRuleText(G.tipo, cant);
  $('clientTotal').textContent = pesos(cant * p);
}
function addToCart() {
  const cant = parseInt($('clientCant').value);
  if (!cant || cant < 1 || cant > 500) { showMsg('orderMsg', 'Ingresa una cantidad válida entre 1 y 500', 'warn'); return; }
  const p = calcPrecio(G.tipo, cant);
  G.carrito.push({ cant, precio: p, sub: cant * p });
  $('clientCant').value = 1;
  updateClientPrice();
  renderCart();
  clearMsg('orderMsg');
}
function renderCart() {
  const cont = $('cartContent');
  if (!G.carrito.length) {
    cont.innerHTML = '<div class="cart-empty"><span class="egg-empty">🥚</span>Tu carrito está vacío</div>';
    $('cartCount').textContent = '0 cubetas';
    return;
  }
  let total = 0, rows = '';
  G.carrito.forEach((item, i) => {
    total += item.sub;
    rows += `<div class="cart-row"><div><strong>${item.cant}</strong> cubeta${item.cant>1?'s':''} × ${pesos(item.precio)}</div><div style="display:flex;align-items:center;gap:.4rem"><strong>${pesos(item.sub)}</strong><button class="btn btn-ghost btn-xs" onclick="removeFromCart(${i})" title="Quitar"><i class="fas fa-times"></i></button></div></div>`;
  });
  cont.innerHTML = rows + `<div class="cart-total"><span>Total</span><span style="font-family:var(--font-head);font-size:1.2rem">${pesos(total)}</span></div>`;
  const tc = G.carrito.reduce((s,i) => s + i.cant, 0);
  $('cartCount').textContent = `${tc} cubeta${tc>1?'s':''}`;
}
window.removeFromCart = i => { G.carrito.splice(i,1); renderCart(); };

async function confirmOrder() {
  if (!G.carrito.length) { showMsg('orderMsg', 'Agrega al menos un item al carrito', 'warn'); return; }
  const btn = $('confirmOrderBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando…';
  clearMsg('orderMsg');
  try {
    const total = G.carrito.reduce((s,i) => s + i.sub, 0);
    const paymentMethod = $('payMethod').value;
    const nota = $('orderNota').value.trim();
    let success = false;
    let attempts = 0;
    const MAX_ATTEMPTS = 3;
    while (!success && attempts < MAX_ATTEMPTS) {
      const num = genInvoiceNumber();
      try {
        await dbCreatePedido({
          invoice_number: num, user_id: G.userId,
          items: JSON.parse(JSON.stringify(G.carrito)), total,
          payment_method: paymentMethod, status: 'Pendiente',
          nota, fecha: new Date().toISOString()
        });
        success = true;
        G.carrito = [];
        $('orderNota').value = '';
        renderCart();
        showMsg('orderMsg', `✅ Pedido <strong>${num}</strong> confirmado. ¡Gracias!`, 'success');
        setTimeout(() => clearMsg('orderMsg'), 8000);
      } catch(e) {
        if (e.message && e.message.includes('duplicate key')) {
          attempts++;
          if (attempts >= MAX_ATTEMPTS) throw new Error('No se pudo generar un número de factura único. Por favor reintenta.');
          await new Promise(r => setTimeout(r, 100));
        } else {
          throw e;
        }
      }
    }
  } catch(e) { showMsg('orderMsg', '❌ ' + (e.message || 'Error al confirmar'), 'error'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar pedido'; }
}

function renderChartDir() {
  const canvas = $('#chartDir');

  const mapa = new Map();
  G.ventasAll.forEach(v => { const d = fmtDateShort(v.fecha); mapa.set(d, (mapa.get(d) || 0) + v.total); });

  if (G.chartDir) G.chartDir.destroy();
  if (!sorted.length) { const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  G.chartDir = new Chart(canvas, {
    type: 'bar',
    data: { labels: sorted.map(e=>e[0]), datasets: [{ label: 'Ventas directas', data: sorted.map(e=>e[1]), backgroundColor: 'rgba(184,113,42,0.75)', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => pesos(v) } } } }
  });
}

  if (!sorted.length) { const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); return; }

    type: 'bar',

  const filtrados = filterByPeriod(G.pedidosAll, periodo);
  if (!filtrados.length) { cont.innerHTML = '<div class="muted">Sin pedidos en este período</div>'; return; }
  cont.innerHTML = filtrados.slice(0,5).map(p => `<div class="order-card ${p.status==='Entregado'?'delivered':''}"><div class="order-meta"><span class="order-num">${escAttr(p.invoice_number)}</span><span class="badge ${p.status==='Entregado'?'badge-delivered':'badge-pending'}">${p.status}</span><span class="order-total" style="margin-left:auto">${pesos(p.total)}</span></div><div class="order-date">${fmtDateShort(p.fecha)}</div></div>`).join('');
}

function exportVentasCSV() {
  if (!G.ventasAll.length) { alert('No hay ventas directas'); return; }
  let csv = 'Fecha,Tipo,Cantidad,Precio Unitario,Total\n';
  G.ventasAll.forEach(v => { csv += `"${fmtDate(v.fecha)}","${v.tipo_nombre}",${v.cant},${v.precio_unitario},${v.total}\n`; });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `ventas_directas_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function exportCsvPedidos() {
  let csv = 'Factura,Fecha,Total,Estado,Pago,Cubetas,Nota\n';
  G.pedidosAll.forEach(p => { csv += `"${p.invoice_number}","${fmtDate(p.fecha)}","${p.total}","${p.status}","${p.payment_method}","${(p.items||[]).reduce((s,i)=>s+i.cant,0)}","${p.nota||''}"\n`; });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `pedidos_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ========== PEDIDOS ==========
async function renderAdminPedidos(cont) {
  cont.innerHTML = '<div class="loader"></div>';
  try { G.pedidosAll = await dbAllPedidos(); } catch(e) { cont.innerHTML = `<div class="alert alert-error">Error: ${escHtml(e.message)}</div>`; return; }
  const users = await dbAllUsers();
  const userMap = new Map(); users.forEach(u => userMap.set(u.user_id, u.nombre));

  cont.innerHTML = `<div class="card"><div class="card-title">📦 Todos los pedidos <small>${G.pedidosAll.length} total</small></div><div class="filter-bar"><button class="chip active" data-pf="todo">Todos</button><button class="chip" data-pf="Pendiente">Pendientes</button><button class="chip" data-pf="Entregado">Entregados</button></div><div id="adminPedidosList"></div></div>`;
  function renderList(filter) {
    const list = filter === 'todo' ? G.pedidosAll : G.pedidosAll.filter(p => p.status === filter);
    const cont2 = $('#adminPedidosList');
    if (!list.length) { cont2.innerHTML = '<div class="cart-empty">Sin pedidos</div>'; return; }
    cont2.innerHTML = list.map(p => `<div class="order-card ${p.status==='Entregado'?'delivered':''}"><div class="order-meta"><div><span class="order-num">${escAttr(p.invoice_number)}</span><span class="badge ${p.status==='Entregado'?'badge-delivered':'badge-pending'}">${p.status}</span></div><span class="order-date">${fmtDate(p.fecha)}</span></div><div style="display:flex;justify-content:space-between;margin-top:.4rem"><span style="font-size:.85rem;color:var(--c-muted)">${p.payment_method} · ${(p.items||[]).reduce((s,i)=>s+i.cant,0)} cubetas</span><span class="order-total">${pesos(p.total)}</span></div>${p.nota?`<div style="font-size:.82rem;color:var(--c-muted);margin-top:.3rem;">📝 ${escAttr(p.nota)}</div>`:''}<div style="margin-top:.65rem;display:flex;gap:.5rem;flex-wrap:wrap">${p.status!=='Entregado'?`<button class="btn btn-success btn-sm" onclick="adminMarkDelivered('${p.id}')"><i class="fas fa-check"></i> Marcar entregado</button>`:''}<button class="btn btn-ghost btn-sm" onclick="adminShowInvoice('${p.id}')"><i class="fas fa-file-invoice"></i> Factura</button></div></div>`).join('');
  }
  cont.querySelectorAll('[data-pf]').forEach(btn => { btn.onclick = () => { cont.querySelectorAll('[data-pf]').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderList(btn.dataset.pf); }; });
  renderList('todo');
}
window.adminMarkDelivered = async (id) => {
  await dbUpdatePedido(id, { status: 'Entregado' });
  G.pedidosAll = await dbAllPedidos();
  await renderAdminTab('pedidos');
};
window.adminShowInvoice = async (pedidoId) => {
  const p = G.pedidosAll.find(x => x.id == pedidoId);
  if (!p) return;
  $('invoiceContent').innerHTML = `<div class="invoice"><div class="invoice-header"><div><div class="invoice-brand">Granja Villa Myriam / Emelina</div><div style="font-size:.8rem;color:var(--c-muted)">NIT: 900.123.456-7</div></div><div class="invoice-num"><div style="font-size:1rem;font-weight:700">${escAttr(p.invoice_number)}</div><div>${fmtDate(p.fecha)}</div><div>${p.status}</div></div></div><div class="invoice-section"><h4>Detalle</h4><table class="invoice-table"><thead><tr><th>Producto</th><th>Cant.</th><th>P.Unit</th><th>Subtotal</th></tr></thead><tbody>${(p.items||[]).map(i=>`<tr><td>Cubeta 24 huevos</td><td>${i.cant}</td><td>${pesos(i.precio)}</td><td>${pesos(i.sub)}</td>`).join('')}</tbody></table></div><div class="invoice-total">Total: ${pesos(p.total)}</div><div class="invoice-footer">IVA exento — Art. 424 E.T.</div></div>`;
  $('invoiceModal').classList.remove('hidden');
};

// ========== USUARIOS ==========
async function renderAdminUsuarios(cont) {
  G.usersAll = await dbAllUsers();
  cont.innerHTML = `<div class="card"><div class="card-title">👥 Gestión de usuarios <small>${G.usersAll.length} total</small></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Nombre</th><th>Email</th><th>Tipo</th><th style="text-align:center">Admin</th><th>Acciones</th></tr></thead><tbody id="usersTableBody"></tbody></table></div><div id="usersMsg" style="margin-top:.75rem"></div></div>`;
  const tipos = ['natural','negocio','empresa','restaurante','comida_rapida','pizzeria','bodega','otro_negocio'];
  const tbody = $('#usersTableBody');
  tbody.innerHTML = G.usersAll.map(u => `<td><input id="un_${u.user_id}" value="${escAttr(u.nombre||'')}"></td><td style="color:var(--c-muted);font-size:.85rem">${escAttr(u.email||'')}</td><td><select id="ut_${u.user_id}">${tipos.map(t=>`<option value="${t}" ${u.tipo===t?'selected':''}>${t}</option>`).join('')}</select></td><td style="text-align:center"><input type="checkbox" id="ua_${u.user_id}" ${u.es_admin?'checked':''}></td><td style="display:flex;gap:.35rem;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="adminSaveUser('${u.user_id}')"><i class="fas fa-save"></i></button><button class="btn btn-danger btn-sm" onclick="adminDeleteUser('${u.user_id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('');
}
window.adminSaveUser = async (uid) => {
  const nombre = $(`un_${uid}`).value.trim();
  const tipo = $(`ut_${uid}`).value;
  const es_admin = $(`ua_${uid}`).checked;
  if (!nombre) { showMsg('usersMsg', 'El nombre no puede estar vacío', 'error'); return; }
  try { await dbUpdateUser(uid, { nombre, tipo, es_admin }); showMsg('usersMsg', '✅ Usuario actualizado', 'success'); setTimeout(() => clearMsg('usersMsg'), 4000); } catch(e) { showMsg('usersMsg', '❌ ' + e.message, 'error'); }
};
window.adminDeleteUser = async (uid) => {
  if (uid === G.userId) { alert('No puedes eliminar tu propio usuario administrador.'); return; }
  if (!confirm('¿Eliminar usuario? Esta acción no se puede deshacer.')) return;
  try { await dbDeleteUser(uid); await renderAdminTab('usuarios'); } catch(e) { alert('Error al eliminar: ' + e.message); }
};

// ========== SUGERENCIAS ==========
async function renderAdminSugerencias(cont) {
  let sugs = [];
  try { sugs = await dbAllSuggs(); } catch(e) { cont.innerHTML = `<div class="alert alert-error">Error: ${escHtml(e.message)}</div>`; return; }
  cont.innerHTML = `<div class="card"><div class="card-title">💬 Buzón de sugerencias <small>${sugs.length} mensajes</small></div>` + (sugs.length ? sugs.map(s => `<div class="sug-card"><div style="font-weight:600">${escHtml(s.nombre||'Anónimo')} ${s.email?`<span style="font-weight:400;font-size:.85rem;color:var(--c-muted)">· ${escHtml(s.email)}</span>`:''}</div><p style="margin-top:.35rem">${escHtml(s.mensaje)}</p><div class="sug-meta">${fmtDate(s.fecha)}</div></div>`).join('') : '<div class="cart-empty">Sin sugerencias aún</div>') + '</div>';
}

// ========== RESPALDO ==========
function renderAdminRespaldo(cont) {
  const logoActual = lsGet('granjaLogo');
  cont.innerHTML = `<div class="card"><div class="card-title">💾 Respaldo de datos</div><p style="margin-bottom:1rem;color:var(--c-muted)">Exporta todos los datos de la aplicación.</p><div style="display:flex;flex-wrap:wrap;gap:.75rem"><button class="btn btn-primary" id="exportJsonBtn"><i class="fas fa-download"></i> JSON completo</button><button class="btn btn-ghost" id="exportPedCsvBtn"><i class="fas fa-file-csv"></i> CSV pedidos</button><button class="btn btn-ghost" id="exportVenCsvBtn"><i class="fas fa-file-csv"></i> CSV ventas</button></div><div id="backupMsg" style="margin-top:.75rem"></div></div><div class="card"><div class="card-title">🖼️ Logo personalizado</div><div class="logo-upload" onclick="$('logoFileInput').click()">${logoActual?`<img src="${escAttr(logoActual)}" class="logo-preview">`:'<img src="logo.svg" class="logo-preview" onerror="this.outerHTML=\'<i class=\\\'fas fa-image\\\' style=\\\'font-size:2rem;color:var(--c-muted)\\\'></i>\'">'}<p style="margin-top:.5rem;color:var(--c-muted);font-size:.85rem">Haz clic para cambiar el logo</p></div>${logoActual?`<button class="btn btn-ghost btn-sm mt-1" id="clearLogoBtn"><i class="fas fa-times"></i> Restaurar logo original</button>`:''}</div>`;
  $('#exportJsonBtn').onclick = async () => {
    const btn = $('#exportJsonBtn'); btn.disabled = true; btn.textContent = 'Exportando…';
    try {
      const data = { fecha_exportacion: new Date().toISOString(), usuarios: await dbAllUsers(), pedidos: await dbAllPedidos(), ventas_directas: await dbAllVentas(), sugerencias: await dbAllSuggs() };
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], { type: 'application/json' })); a.download = `respaldo_${new Date().toISOString().slice(0,10)}.json`; a.click();
      showMsg('backupMsg', '✅ Respaldo exportado', 'success');
    } catch(e) { showMsg('backupMsg', '❌ ' + e.message, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> JSON completo'; }
  };
  $('#exportPedCsvBtn').onclick = async () => {
    const ped = await dbAllPedidos();
    let csv = 'Factura,Fecha,Total,Estado,Pago,Cubetas,Nota\n';
    ped.forEach(p => csv += `"${p.invoice_number}","${fmtDate(p.fecha)}","${p.total}","${p.status}","${p.payment_method}","${(p.items||[]).reduce((s,i)=>s+i.cant,0)}","${p.nota||''}"\n`);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'pedidos.csv'; a.click();
  };
  $('#exportVenCsvBtn').onclick = async () => {
    const ven = await dbAllVentas();
    let csv = 'Fecha,Tipo,Cantidad,P.Unitario,Total\n';
    ven.forEach(v => csv += `"${fmtDate(v.fecha)}","${v.tipo_nombre}",${v.cant},${v.precio_unitario},${v.total}\n`);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'ventas_directas.csv'; a.click();
  };
  const clr = $('#clearLogoBtn');
  if (clr) clr.onclick = () => { if (confirm('¿Restaurar el logo original?')) { lsSet('granjaLogo', ''); ['clientTopLogo','adminTopLogo'].forEach(id => setLogoEl($(id))); renderAdminRespaldo(cont); } };
}

// ========== SUPER ADMIN ==========
async function renderAdminAdmins(cont) {
  G.usersAll = await dbAllUsers();
  const admins = G.usersAll.filter(u => u.es_admin === true);
  cont.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-crown"></i> Gestión de Administradores</div><div id="adminsMsg"></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Acciones</th></tr></thead><tbody id="adminsTableBody"></tbody></table></div><button class="btn btn-primary btn-sm mt-2" id="btnAddAdmin"><i class="fas fa-plus"></i> Agregar administrador</button></div>`;
  const tbody = $('#adminsTableBody');
  tbody.innerHTML = admins.map(u => `<td><input id="adm_name_${u.user_id}" value="${escAttr(u.nombre)}"></td><td style="white-space:nowrap">${escAttr(u.email)}</td><td>${u.es_admin ? '<span class="badge badge-admin">Super Admin</span>' : 'Admin'}</td><td style="white-space:nowrap"><button class="btn btn-primary btn-sm" onclick="updateAdmin('${u.user_id}')"><i class="fas fa-save"></i></button>${u.user_id !== G.userId ? `<button class="btn btn-danger btn-sm" onclick="deleteAdmin('${u.user_id}')"><i class="fas fa-trash"></i></button>` : ''}</td></tr>`).join('');
  window.updateAdmin = async (uid) => {
    const newName = $(`adm_name_${uid}`).value.trim();
    if (!newName) { showMsg('adminsMsg', 'El nombre no puede estar vacío', 'error'); return; }
    try { await dbUpdateUser(uid, { nombre: newName }); showMsg('adminsMsg', '✅ Administrador actualizado', 'success'); await renderAdminTab('admins'); } catch(e) { showMsg('adminsMsg', e.message, 'error'); }
  };
  window.deleteAdmin = async (uid) => {
    if (!confirm('¿Eliminar este administrador? Ya no podrá acceder como admin.')) return;
    try { await dbUpdateUser(uid, { es_admin: false }); showMsg('adminsMsg', '✅ Administrador eliminado', 'success'); await renderAdminTab('admins'); } catch(e) { showMsg('adminsMsg', e.message, 'error'); }
  };
  $('#btnAddAdmin').onclick = async () => {
    const email = prompt('Correo electrónico del nuevo administrador:');
    if (!email) return;
    const nombre = prompt('Nombre completo:');
    if (!nombre) return;
    const pass = Math.random().toString(36).slice(2, 10);
    try {
      const { data, error } = await window.supabase.auth.signUp({ email, password: pass, options: { data: { nombre } } });
      if (error) throw error;
      await window.supabase.from('usuarios').update({ es_admin: true, nombre }).eq('user_id', data.user.id);
      alert(`Administrador creado. Contraseña temporal: ${pass}\nEl usuario deberá cambiar su contraseña después de iniciar sesión.`);
      await renderAdminTab('admins');
    } catch(e) { showMsg('adminsMsg', e.message, 'error'); }
  };
}

// =================================================================
//  BOOT
// =================================================================
(async function boot() {
  initModals();
  const { data: { session } } = await window.supabase.auth.getSession();
  if (!session) { $('authPage').style.display = ''; initAuthPage(); return; }
  try {
    G.userId = session.user.id;
    const profile = await dbProfile(G.userId);
    G.tipo = profile.tipo || 'natural';
    G.esAdmin = profile.es_admin || false;
    G.nombre = profile.nombre || 'Usuario';
    G.email = profile.email || session.user.email || '';
    G.documento = profile.documento || '';
    G.direccion = profile.direccion || '';
  } catch(e) {
    await window.supabase.auth.signOut();
    $('authPage').style.display = '';
    initAuthPage();
    showMsg('loginErr', 'Tu perfil no está disponible. Por favor regístrate de nuevo.', 'warn');
    return;
  }
  $('authPage').style.display = 'none';
  if (G.esAdmin) { $('adminPage').classList.add('active'); await initAdminPage(); }
  else { $('clientPage').classList.add('active'); initClientPage(); }
})();
</script>
